<html>
<head>
    <title>Balloon</title>
    <style>
        /* Center the balloon on the screen */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* The Balloon properties */
        #balloon {
            width: 200px;
            height: 200px;
            background-color: red;
            border-radius: 50%; /* Makes it a circle */
            cursor: pointer;
            transition: all 0.2s ease; /* Makes the size change smooth */
        }
    </style>
</head>
<body>

    <div id="balloon" onclick="inflate()" onmouseleave="deflate()"></div>

    <script>
        // --- VARIABLES ---
        var balloon = document.getElementById("balloon");
        var size = 200;
        var colors = ['red', 'green', 'blue']; // The color order
        var colorIndex = 0; // 0=red, 1=green, 2=blue

        // --- FUNCTION 1: CLICK (INFLATE) ---
        function inflate() {
            // 1. Increase size
            size += 10;

            // 2. Change color (Next in list)
            colorIndex++;
            if (colorIndex > 2) {
                colorIndex = 0; // Loop back to Red
            }

            // 3. Check for Explosion
            if (size > 420) {
                size = 200;       // Reset size
                colorIndex = 0;   // Reset to Red
            }

            // 4. Apply changes
            updateBalloon();
        }

        // --- FUNCTION 2: MOUSE LEAVE (DEFLATE) ---
        function deflate() {
            // 1. Decrease size (but not below 200)
            size -= 5;
            if (size < 200) {
                size = 200;
            }

            // 2. Change color (Previous in list)
            colorIndex--;
            if (colorIndex < 0) {
                colorIndex = 2; // Loop back to Blue
            }

            // 3. Apply changes
            updateBalloon();
        }

        // --- HELPER FUNCTION ---
        function updateBalloon() {
            balloon.style.width = size + 'px';
            balloon.style.height = size + 'px';
            balloon.style.backgroundColor = colors[colorIndex];
        }
    </script>

</body>
</html>
