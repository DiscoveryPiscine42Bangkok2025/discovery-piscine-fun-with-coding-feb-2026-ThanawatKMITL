<html>
<head>
    <title>Balloon jQuery</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #balloon {
            width: 200px;
            height: 200px;
            background-color: red;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }
    </style>
</head>
<body>

    <div id="balloon"></div>

    <script>
        $(document).ready(function() {
            // Variables
            var size = 200;
            var colors = ['red', 'green', 'blue'];
            var colorIndex = 0;

            // Helper to update CSS
            function updateBalloon() {
                $('#balloon').css({
                    'width': size + 'px',
                    'height': size + 'px',
                    'background-color': colors[colorIndex]
                });
            }

            // EVENT 1: CLICK (Inflate)
            $('#balloon').click(function() {
                size += 10;
                colorIndex++;

                if (colorIndex > 2) {
                    colorIndex = 0;
                }

                if (size > 420) {
                    size = 200;
                    colorIndex = 0;
                }

                updateBalloon();
            });

            // EVENT 2: MOUSE LEAVE (Deflate)
            $('#balloon').mouseleave(function() {
                size -= 5;
                if (size < 200) {
                    size = 200;
                }

                colorIndex--;
                if (colorIndex < 0) {
                    colorIndex = 2;
                }

                updateBalloon();
            });
        });
    </script>

</body>
</html>
