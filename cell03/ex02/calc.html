<html>
<head>
    <title>Calculator</title>
    <style>
        /* Simple styling to make it look decent */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .calc-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, select, input[type="submit"] {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="calc-container">
        <input type="text" id="leftOp">
        
        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>

        <input type="text" id="rightOp">

        <input type="submit" value="Try me!" onclick="calc()">
    </div>

    <script>
        // --- 1. THE 30-SECOND NAG ---
        // setInterval runs a function repeatedly. Here: every 30000ms (30s).
        setInterval(function() {
            alert("Please, use me...");
        }, 30000);

        // --- 2. THE CALCULATOR ---
        function calc() {
            // Get the values
            var leftStr = document.getElementById("leftOp").value;
            var rightStr = document.getElementById("rightOp").value;
            var op = document.getElementById("operator").value;

            // Convert to Integers
            var left = parseInt(leftStr);
            var right = parseInt(rightStr);

            // ERROR CHECK 1: Must be positive numbers (>= 0)
            // We also check if the input is essentially correct (not letters)
            if (left < 0 || right < 0 || isNaN(left) || isNaN(right)) {
                alert("Error :(");
                return; // Stop the function here
            }

            // ERROR CHECK 2: Divide by Zero
            if ((op === '/' || op === '%') && right === 0) {
                console.log("It's over 9000!");
                alert("It's over 9000!");
                return;
            }

            // DO THE MATH
            var result = 0;
            if (op === '+') result = left + right;
            if (op === '-') result = left - right;
            if (op === '*') result = left * right;
            if (op === '/') result = left / right;
            if (op === '%') result = left % right;

            // OUTPUT
            console.log(result);
            alert(result);
        }
    </script>

</body>
</html>
